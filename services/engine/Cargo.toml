[package]
name = "dwa-engine"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
getrandom = "0.4.3"
base64 = "0.23.1"
flate2 = "1.1.11"
crc32fast = "1.5.0"
quick-xml = "0.42.0"
png = "0.18.1"
